<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single mission card under a status strip (five-step route + points meter). */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --ink:#16282b; --muted:#587074; --line:#c9d6d6;
  --cell:#e3f0ee; --cell-edge:#8fb8b3; --mito:#f8dccf; --mito-ink:#b5553a; --blood:#f3d3d3;
  --glucose:#3f62d6; --fat:#c2488a; --amino:#5f9420; --carrier:#12909a; --proton:#8556d8;
  --gas:#7c8f96; --atp:#e39a0c; --atp-ink:#8a5a00;
  --rich:#d23b3b; --poor:#3f5fc9; --o2:#e0552f; --co2:#5d7f9c; --food:#a9743a; --waste:#6b4a2a;
  --water:#2f9fd0; --gland:#f3e2a8; --bread:#e3b877; --egg:#fffdf5; --medal:#e39a0c;
  --good:#2f7d3a; --good-bg:#e2f2e0; --bad:#b3402e; --bad-bg:#fae4df;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme:dark;
  --bg:#0f1a1c; --panel:#17272a; --ink:#e6f0ef; --muted:#93aaad; --line:#2f4649;
  --cell:#16302f; --cell-edge:#3f7a74; --mito:#44271f; --mito-ink:#f09a7c; --blood:#4a2428;
  --glucose:#8fa6ff; --fat:#f08cc0; --amino:#a6d65a; --carrier:#4fd0d8; --proton:#b99aff;
  --gas:#9fb2b8; --atp:#ffc24a; --atp-ink:#ffd98a;
  --rich:#ff7a70; --poor:#8fa6ff; --o2:#ff9a6a; --co2:#9fc0dc; --food:#d9a56a; --waste:#b08a62;
  --water:#6cc6ee; --gland:#6a5a22; --bread:#c79a5a; --egg:#f3efe2; --medal:#ffc24a;
  --good:#8fd69a; --good-bg:#173a20; --bad:#f5a090; --bad-bg:#4a211a; } }
*{box-sizing:border-box}
html,body{margin:0}
.home-link{align-self:flex-start;font:500 14px var(--body);color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--ink);text-decoration:underline}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 18px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
.meter{display:flex;align-items:center;gap:10px;min-width:220px;flex:1;max-width:400px}
button.restart{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--panel)}
.meter .track{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--atp);transition:width .5s ease}
.meter b{font-family:var(--display);font-size:20px;color:var(--atp-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.route{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:13px}
.route li{padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.route li.now{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.route li.past{border-color:var(--cell-edge);color:var(--ink);background:var(--cell)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.where{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0}
h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.cols>div{display:flex;flex-direction:column;gap:10px}
.cols h3,.done-list h3{font-size:13px;font-weight:600;color:var(--muted);margin:0}
button{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--atp);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--ink);background:var(--cell)}
button.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--muted);text-decoration:line-through}
button:disabled{cursor:default}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;align-self:flex-start;text-align:center;padding:12px 22px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.meter .fill{transition:none}}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row span{flex:1;min-width:200px}
.row button{padding:8px 14px;font-size:15px}
.done-list ol{margin:6px 0 0;padding-left:22px}
.field{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-weight:600}
input{font:500 18px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;max-width:120px}
.fb{border-radius:12px;padding:12px 16px;border-left:5px solid var(--line);background:var(--bg)}
.fb:empty{display:none}
.fb.ok{border-color:var(--good);background:var(--good-bg)}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb strong{display:block}
.qhead{display:flex;gap:18px;align-items:center}
.qhead>div:first-child{flex:1;display:flex;flex-direction:column;gap:10px}
.art{flex:0 0 190px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px}
.art svg{display:block;width:100%;height:auto}
.organ{fill:var(--mito);stroke:var(--mito-ink);stroke-width:2.5}
.stars{display:inline-flex;gap:2px;vertical-align:-3px;margin-right:8px}
.stars svg{width:20px;height:20px;animation:pop .4s backwards}
.stars svg:nth-child(2){animation-delay:.12s}
.stars svg:nth-child(3){animation-delay:.24s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (max-width:520px){.qhead{flex-direction:column-reverse;align-items:stretch}.art{flex:none;width:100%;max-width:240px;align-self:center}}
@media (prefers-reduced-motion: reduce){.stars svg{animation:none}}
.best{font-size:14px;color:var(--muted);margin:-6px 0 0}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--atp-ink);font-variant-numeric:tabular-nums}
@media (max-width:520px){.cols{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>
<main>
  <a class="home-link" href="index.html">← All pages</a>
  <div class="top">
    <h1>Heartbeat Run</h1>
    <div class="meter" aria-label="Points earned">
      <div class="track"><div class="fill" id="fill"></div></div>
      <b id="score">0 points</b>
      <button type="button" class="restart" id="restart">Restart</button>
    </div>
  </div>
  <p class="best" id="best"></p>
  <ol class="route" id="route" aria-label="Steps"></ol>
  <section class="card" id="card"></section>
</main>

    for(var i=0;i<1;i++)html+='<svg viewBox="0 0 20 20"><polygon points="10,1 12.6,7 19,7.4 14,11.6 15.6,18 10,14.4 4.4,18 6,11.6 1,7.4 7.4,7" fill="'+(i<n?'var(--atp)':'none')+'" stroke="var(--atp-ink)" stroke-width="1.2"/></svg>';
    s.innerHTML=html;return s;
  }

  /* Points for the home page: the best score for this page is kept in the browser.
     It is saved after every correct answer, so a half-finished game still counts. */
  var KEY='study-points:'+PAGE_ID,startBest=0;
  function readBest(){
    try{
      var r=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!r||typeof r.best!=='number')return 0;
      /* s:1 marks the one-point-per-question scoring. Such a score carries over when questions are added or removed, capped at the new maximum. */
      if(r.s===1)return Math.max(0,Math.min(r.best,MAX));
      /* a save from before the marker existed, on the same scale: mark it so it carries over from now on */
      if(r.max===MAX){localStorage.setItem(KEY,JSON.stringify({best:r.best,max:MAX,s:1}));return r.best;}
      return 0;
    }catch(e){return null;}
  }
  function saveBest(score){
    try{var cur=readBest();if(cur===null)return false;
      if(score>cur)localStorage.setItem(KEY,JSON.stringify({best:score,max:MAX,s:1}));
      return true;
    }catch(e){return false;}
  }
  /* The latest try is kept too, so reopening or refreshing the page carries on where it stopped. */
  var PKEY='study-progress:'+PAGE_ID;
  function saveProgress(i){
    try{localStorage.setItem(PKEY,JSON.stringify({v:2,i:i,score:st.score,guess:st.guess,startBest:startBest,n:Q.length}));}catch(e){}
  }
  function loadProgress(){
    try{var p=JSON.parse(localStorage.getItem(PKEY)||'null');
      if(p&&p.v===2&&p.n===Q.length&&p.i>=0&&p.i<=Q.length&&typeof p.score==='number'&&p.score>=0&&p.score<=MAX)return p;
    }catch(e){}
    return null;
  }
  function restart(){
    st={i:-1,score:0,guess:null};
    try{localStorage.removeItem(PKEY);}catch(e){}
    intro();
  }
  function showBest(){
    var b=readBest(),el=document.getElementById('best');
    el.textContent=b===null?'This browser window is not saving points. Try Chrome, Edge or Safari, outside private mode.'
      :(b?'Your best score so far: '+b+' / '+MAX+' (saved). This is what counts on the home page.':'No score saved yet. Points are saved as you play.');
  }
  function h(tag,attrs,kids){
    var e=document.createElement(tag),k;
    for(k in attrs||{}){
      if(k==='text')e.textContent=attrs[k];
      else if(k==='on')for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);
      else e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){e.appendChild(c);});
    return e;
  }
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}

  STAGES.forEach(function(s,i){route.appendChild(h('li',{text:(i+1)+'. '+s.name}));});
  function status(){
    var cur=st.i<0?-1:(st.i>=Q.length?STAGES.length:Q[st.i].s);
    [].forEach.call(route.children,function(li,i){li.className=i===cur?'now':(i<cur?'past':'');});
    document.getElementById('fill').style.width=(st.score/MAX*100)+'%';
    document.getElementById('score').textContent=st.score+' '+(st.score===1?UNIT1:UNIT);
    showBest();
  }
  function show(nodes){card.innerHTML='';nodes.forEach(function(n){card.appendChild(n);});status();}

  /* ---------- intro: the learner makes a prediction ---------- */
  function intro(){
    startBest=readBest()||0;
    var fb=h('div',{'class':'fb','aria-live':'polite'});
    var guessBtns=shuffle(CFG.predict.opts.map(function(t,i){return i;})).map(function(i){
      return h('button',{type:'button','aria-pressed':'false',text:CFG.predict.opts[i],on:{click:function(){
        guessBtns.forEach(function(b){b.setAttribute('aria-pressed','false');});
        this.setAttribute('aria-pressed','true');st.guess=i;fb.textContent='';
      }}});
    });
    show([
      head('Your mission',CFG.intro.heading,CFG.intro.art),
      h('p',{text:CFG.intro.text+' Each question is worth 1 '+UNIT1+'. You earn it by getting the answer right on your first try.'}),
      h('p',{text:'Before you start, make a prediction. '+CFG.predict.q}),
      h('div',{'class':'opts'},guessBtns),
      fb,
      h('button',{'class':'go',type:'button',text:'Start the mission',on:{click:function(){
        if(st.guess===null){fb.textContent='Pick a guess first. There is no penalty for being wrong.';return;}
        st.i=0;saveProgress(0);play();
      }}})
    ]);
  }

  /* ---------- one challenge ---------- */
  function play(){
    var c=Q[st.i],misses=0,fb=h('div',{'class':'fb','aria-live':'polite'}),body;
    function miss(el){misses++;if(el)shake(el);fb.className='fb no';fb.innerHTML='';fb.appendChild(h('strong',{text:'Not quite.'}));fb.appendChild(document.createTextNode(c.hint||''));}
    function win(){
      var pts=misses?0:1;st.score+=pts;saveBest(st.score);saveProgress(st.i+1);
      fb.className='fb ok';fb.innerHTML='';
      fb.appendChild(h('strong',{},[stars(pts),document.createTextNode(pts?'Correct. +1 '+UNIT1:'Got it. No '+UNIT1+' this time, because it took more than one try.')]));
      fb.appendChild(document.createTextNode(c.why));
      var last=st.i===Q.length-1;
      var next=h('button',{'class':'go',type:'button',text:last?'See your results':'Next',on:{click:function(){st.i++;st.i<Q.length?play():end();}}});
      card.appendChild(next);status();next.focus();
    }

    if(c.type==='choice'){
      var order=shuffle(c.opts.map(function(t,i){return i;}));
      var btns=order.map(function(i){
        return h('button',{type:'button',text:c.opts[i],on:{click:function(){
          if(i===0){this.classList.add('right');btns.forEach(function(b){b.disabled=true;});win();}
          else{this.classList.add('wrong');this.disabled=true;miss(this);}
        }}});
      });
      body=h('div',{'class':'opts'},btns);
    }

    if(c.type==='match'){
      var picked=null,left=0;
      var L=c.pairs.map(function(p,i){
        return h('button',{type:'button','aria-pressed':'false',text:p[0],on:{click:function(){
          L.forEach(function(b){b.setAttribute('aria-pressed','false');});
          this.setAttribute('aria-pressed','true');picked=i;
        }}});
      });
      var R=shuffle(c.pairs.map(function(p,i){return i;})).map(function(i){
        return h('button',{type:'button',text:c.pairs[i][1],on:{click:function(){
          if(picked===null){fb.className='fb';fb.textContent='Choose an item on the left first, then its match.';return;}
          if(picked===i){
            this.classList.add('right');this.disabled=true;
            L[i].classList.add('right');L[i].disabled=true;L[i].setAttribute('aria-pressed','false');
            picked=null;left++;fb.className='fb';fb.textContent='';
            if(left===c.pairs.length)win();
          }else miss(this);
        }}});
      });
      body=h('div',{'class':'cols'},[
        h('div',{},[h('h3',{text:c.leftTitle})].concat(L)),
        h('div',{},[h('h3',{text:c.rightTitle})].concat(R))
      ]);
    }

    if(c.type==='order'){
      var nextStep=0,list=h('ol',{});
      var doneBox=h('div',{'class':'done-list'},[h('h3',{text:'Your order so far'}),list]);
      var sb=shuffle(c.steps.map(function(t,i){return i;})).map(function(i){
        return h('button',{type:'button',text:c.steps[i],on:{click:function(){
          if(i===nextStep){
            this.classList.add('right');this.disabled=true;list.appendChild(h('li',{text:c.steps[i]}));
            nextStep++;fb.className='fb';fb.textContent='';
            if(nextStep===c.steps.length)win();
          }else miss(this);
        }}});
      });
      body=h('div',{'class':'opts'},sb.concat([doneBox]));
    }

    if(c.type==='sort'){
      var remaining=c.items.length;
      body=h('div',{},shuffle(c.items).map(function(it){
        var bs=c.cats.map(function(cat,k){
          return h('button',{type:'button',text:cat,on:{click:function(){
            if(k===it[1]){this.classList.add('right');bs.forEach(function(b){b.disabled=true;});remaining--;
              fb.className='fb';fb.textContent='';if(remaining===0)win();}
            else{this.classList.add('wrong');this.disabled=true;miss(this);}
          }}});
        });
        return h('div',{'class':'row'},[h('span',{text:it[0]})].concat(bs));
      }));
    }

    if(c.type==='number'){
      var inp=h('input',{id:'answer-'+st.i,type:'number',inputmode:'numeric',min:'0',max:'9999'});
      var check=h('button',{'class':'go',type:'submit',text:'Check'});
      body=h('form',{'class':'field',on:{submit:function(e){
        e.preventDefault();
        var v=parseFloat(inp.value);
        if(isNaN(v)){fb.className='fb';fb.textContent='Type a number, then press Check.';return;}
        if(v>=c.min&&v<=c.max){inp.disabled=true;check.disabled=true;check.style.display='none';win();}
        else{misses++;shake(inp);fb.className='fb no';fb.innerHTML='';
          fb.appendChild(h('strong',{text:'Not quite.'}));
          fb.appendChild(document.createTextNode((v<c.min?'Try a higher number. ':'Try a lower number. ')+(c.hint||'')));}
      }}},[h('label',{'for':'answer-'+st.i,text:c.label}),inp,check]);
    }

    show([
      head('Step '+(c.s+1)+' of '+STAGES.length+' \u00b7 '+STAGES[c.s].name+' \u00b7 '+STAGES[c.s].where,c.q,c.art),
      body,fb
    ]);
    var first=card.querySelector('input,button');if(first&&st.i>0)first.focus();
  }

  /* ---------- results ---------- */
  function end(){
    var tier=st.score>=MAX-1?0:(st.score>=MAX*0.65?1:2),rank=CFG.ranks[tier];
    card.style.setProperty('--medal',['var(--atp)','var(--gas)','var(--food)'][tier]);
    var guessed=st.guess===0;
    var saved=saveBest(st.score);
    var savedMsg=!saved?'Your points could not be saved in this browser window.'
      :(st.score>startBest?'New best score. '+st.score+' '+UNIT+' now count toward your total on the home page.'
      :'Your best score on this page is still '+readBest()+'. Beat it to raise your total.');
    show([
      head('Mission complete',CFG.endHeading,'medal'),
      h('p',{'class':'big',text:st.score+' / '+MAX+' '+UNIT}),
      h('p',{text:'Rank: '+rank+'.'}),
      h('p',{text:savedMsg}),
      h('div',{'class':'fb '+(guessed?'ok':'')},[
        h('strong',{text:guessed?'Your prediction was right.':'Your prediction was not right this time.'}),
        document.createTextNode(CFG.predict.why)
      ]),
      h('p',{text:CFG.summary}),
      h('button',{'class':'go',type:'button',text:'Play again',on:{click:restart}})
    ]);
  }

  /* the first option in every list is the correct one; lists are shuffled when shown */
  document.getElementById('restart').addEventListener('click',restart);
  var saved=loadProgress();
  if(saved){
    st.i=saved.i;st.score=saved.score;st.guess=saved.guess;startBest=saved.startBest||0;
    st.i<Q.length?play():end();
  }else intro();
})();
</script>
</body>
</html>
