<title>Cell Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a mission card under a status strip (three-level route + points meter). Level 1 is a card grid; levels 2 and 3 share one cell diagram. */
:root{
  --bg:#f2f5f4; --panel:#ffffff; --ink:#16282b; --muted:#587074; --line:#c9d6d6;
  --cell:#e3f0ee; --cell-edge:#8fb8b3; --mito:#f8dccf; --mito-ink:#b5553a; --blood:#f3d3d3;
  --glucose:#3f62d6; --fat:#c2488a; --amino:#5f9420; --carrier:#12909a; --proton:#8556d8;
  --gas:#7c8f96; --atp:#e39a0c; --atp-ink:#8a5a00;
  --rich:#d23b3b; --poor:#3f5fc9; --o2:#e0552f; --co2:#5d7f9c; --food:#a9743a; --waste:#6b4a2a;
  --water:#2f9fd0; --gland:#f3e2a8; --bread:#e3b877; --egg:#fffdf5; --medal:#e39a0c;
  --good:#2f7d3a; --good-bg:#e2f2e0; --bad:#b3402e; --bad-bg:#fae4df;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme:dark;
  --bg:#0f1a1c; --panel:#17272a; --ink:#e6f0ef; --muted:#93aaad; --line:#2f4649;
  --cell:#16302f; --cell-edge:#3f7a74; --mito:#44271f; --mito-ink:#f09a7c; --blood:#4a2428;
  --glucose:#8fa6ff; --fat:#f08cc0; --amino:#a6d65a; --carrier:#4fd0d8; --proton:#b99aff;
  --gas:#9fb2b8; --atp:#ffc24a; --atp-ink:#ffd98a;
  --rich:#ff7a70; --poor:#8fa6ff; --o2:#ff9a6a; --co2:#9fc0dc; --food:#d9a56a; --waste:#b08a62;
  --water:#6cc6ee; --gland:#6a5a22; --bread:#c79a5a; --egg:#f3efe2; --medal:#ffc24a;
  --good:#8fd69a; --good-bg:#173a20; --bad:#f5a090; --bad-bg:#4a211a; } }
*{box-sizing:border-box}
html,body{margin:0}
.home-link{align-self:flex-start;font:500 14px var(--body);color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--ink);text-decoration:underline}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:24px 18px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em}
.meter{display:flex;align-items:center;gap:10px;min-width:220px;flex:1;max-width:400px}
.meter .track{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--atp);transition:width .5s ease}
.meter b{font-family:var(--display);font-size:20px;color:var(--atp-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.best{font-size:14px;color:var(--muted);margin:-6px 0 0}
.route{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;font-size:13px}
.route li{padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.route li.now{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.route li.past{border-color:var(--cell-edge);color:var(--ink);background:var(--cell)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.where{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0}
h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h2 em{font-style:normal;color:var(--atp-ink)}
p{margin:0;max-width:62ch}
.qhead{display:flex;gap:18px;align-items:center}
.qhead>div:first-child{flex:1;display:flex;flex-direction:column;gap:10px}
.hero{flex:0 0 190px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px}
.hero svg{display:block;width:100%;height:auto}
.organ{fill:var(--mito);stroke:var(--mito-ink);stroke-width:2.5}
button{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--atp);outline-offset:2px}
button.right{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--muted);text-decoration:line-through}
button:disabled{cursor:default}
button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;align-self:flex-start;text-align:center;padding:12px 22px}
button.restart{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--panel)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.go.alt{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:12px;padding:12px 16px;border-left:5px solid var(--line);background:var(--bg)}
.fb:empty{display:none}
.fb.ok{border-color:var(--good);background:var(--good-bg)}
.fb.no{border-color:var(--bad);background:var(--bad-bg)}
.fb strong{display:block}
.stars{display:inline-flex;vertical-align:-3px;margin-right:8px}
.stars svg{width:20px;height:20px;animation:pop .4s backwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--atp-ink);font-variant-numeric:tabular-nums}

/* Level 1 cards */
.deck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flip{min-height:150px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:14px;line-height:1.35;background:var(--panel)}
.flip svg{width:110px;height:55px;flex:none}
.flip.down{background:var(--cell);border-style:dashed;border-color:var(--cell-edge);font-family:var(--display);font-size:34px;color:var(--cell-edge)}
.flip.miss{background:var(--bad-bg);border-color:var(--bad)}

/* Cell diagram (levels 2 and 3) */
.scene{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.scene svg{display:block;width:100%;height:auto;max-height:60vh}
.scene.wide svg{min-width:600px}
.scene text{font-family:var(--body);fill:var(--ink);font-size:13px;font-weight:600}
.scene .sub{font-weight:400;fill:var(--muted);font-size:12px}
.mv{transition:transform 1s ease,opacity .6s ease}
.pin circle{fill:var(--ink)} .pin text{fill:var(--bg);font-size:13px;font-weight:600}
.pick .part{cursor:pointer}
.pick .part:hover,.pick .pin:hover{filter:brightness(1.08)}
.part.hit{filter:drop-shadow(0 0 6px var(--good))}
.lab{opacity:0;transition:opacity .4s}
.lab.on{opacity:1}
@media (max-width:640px){.deck{grid-template-columns:repeat(2,1fr)}.qhead{flex-direction:column-reverse;align-items:stretch}.hero{flex:none;width:100%;max-width:240px;align-self:center}.card{padding:18px}}
@media (prefers-reduced-motion: reduce){.shake,.stars svg{animation:none}.mv,.meter .fill{transition:none}}
</style>
</head>

</main>

  var KEY='study-points:'+PAGE_ID,PKEY='study-progress:'+PAGE_ID;
  function readBest(){
    try{
      var r=JSON.parse(localStorage.getItem(KEY)||'null');
      if(!r||typeof r.best!=='number')return 0;
      return Math.max(0,Math.min(r.best,MAX));
    }catch(e){return null;}
  }
  function saveBest(score){
    try{var cur=readBest();if(cur===null)return false;
      if(score>cur)localStorage.setItem(KEY,JSON.stringify({best:score,max:MAX,s:1}));
      return true;
    }catch(e){return false;}
  }
  function saveProgress(i){
    try{localStorage.setItem(PKEY,JSON.stringify({v:3,i:i,score:st.score,got:st.got,startBest:startBest,n:MAX,order:st.order,cards:st.cards}));}catch(e){}
  }
  function loadProgress(){
    try{var p=JSON.parse(localStorage.getItem(PKEY)||'null');
      if(p&&p.v===3&&p.n===MAX&&p.i>=0&&p.i<=MAX&&typeof p.score==='number'&&p.score>=0&&p.score<=MAX&&Array.isArray(p.got)
         &&Array.isArray(p.order)&&p.order.length===TERMS.length&&Array.isArray(p.cards)&&p.cards.length===TERMS.length)return p;
    }catch(e){}
    return null;
  }
  function restart(){
    st={i:-1,score:0,order:[],cards:[],got:[]};introSeen={};peeked=false;
    try{localStorage.removeItem(PKEY);}catch(e){}
    intro();
  }
  function showBest(){
    var b=readBest(),el=document.getElementById('best');
    el.textContent=b===null?'This browser window is not saving points. Try Chrome, Edge or Safari, outside private mode.'
      :(b?'Your best score so far: '+b+' / '+MAX+' (saved). This is what counts on the home page.':'No score saved yet. Points are saved as you play.');
  }

  /* ---------- helpers ---------- */
  function h(tag,attrs,kids){
    var e=document.createElement(tag),k;
    for(k in attrs||{}){
      if(k==='text')e.textContent=attrs[k];
      else if(k==='html')e.innerHTML=attrs[k];
      else if(k==='on')for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);
      else e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){e.appendChild(c);});
    return e;
  }
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
  function starHTML(on){return '<span class="stars" aria-hidden="true"><svg viewBox="0 0 20 20"><polygon points="10,1 12.6,7 19,7.4 14,11.6 15.6,18 10,14.4 4.4,18 6,11.6 1,7.4 7.4,7" fill="'+(on?'var(--atp)':'none')+'" stroke="var(--atp-ink)" stroke-width="1.2"/></svg></span>';}
  function head(where,titleHTML,art){
    var left=h('div',{},[h('p',{'class':'where',text:where}),h('h2',{html:titleHTML})]);
    var kids=[left];
    if(art)kids.push(h('div',{'class':'hero',html:'<svg viewBox="0 0 200 130" aria-hidden="true">'+art+'</svg>'}));
    return h('div',{'class':'qhead'},kids);
  }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  LEVELS.forEach(function(l,i){route.appendChild(h('li',{text:'Level '+(i+1)+': '+l.name}));});
  function status(){
    var cur=viewing!==null?Q[viewing].lv:(st.i<0?-1:(st.i>=MAX?LEVELS.length:Q[st.i].lv));
    [].forEach.call(route.children,function(li,i){li.className=i===cur?'now':(i<cur?'past':'');});
    document.getElementById('fill').style.width=(st.score/MAX*100)+'%';
    document.getElementById('score').textContent=st.score+' '+(st.score===1?'point':'points');
    showBest();
  }
  function show(nodes){card.innerHTML='';nodes.forEach(function(n){card.appendChild(n);});status();}
  function levelStart(lv){for(var k=0;k<MAX;k++)if(Q[k].lv===lv)return k;return 0;}

  /* ---------- the cell diagram ---------- */
  var PART_NAME={nucleus:'Nucleus',membrane:'Cell membrane',cytoplasm:'Cytoplasm',mito:'Mitochondrion'};
  var HEX='0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5';
  function sceneSVG(lv){
    var s='<svg viewBox="'+(lv===1?'270 0 450 340':'0 0 720 340')+'" role="img" aria-label="Diagram of a cell">';
    /* cell */
    s+='<rect class="part" data-part="cytoplasm" x="300" y="30" width="400" height="280" rx="90" fill="var(--cell)"/>';
    s+='<rect x="300" y="30" width="400" height="280" rx="90" fill="none" stroke="var(--cell-edge)" stroke-width="11"/>';
    s+='<g class="part" data-part="nucleus"><circle cx="420" cy="170" r="55" fill="var(--proton)" opacity=".5"/><circle cx="420" cy="170" r="20" fill="var(--proton)"/></g>';
    s+='<g class="part" data-part="mito"><rect x="540" y="130" width="120" height="64" rx="32" fill="var(--mito)" stroke="var(--mito-ink)" stroke-width="3"/>'
      +'<path d="M556,164 q9,-28 18,0 t18,0 t18,0 t18,0 t18,0" fill="none" stroke="var(--mito-ink)" stroke-width="3" stroke-linecap="round"/></g>';
    s+='<rect class="part" data-part="membrane" x="300" y="30" width="400" height="280" rx="90" fill="none" stroke="transparent" stroke-width="26" pointer-events="stroke"/>';
    /* pins A-D (also work from the keyboard) */
    [['A','cytoplasm',490,270],['B','mito',600,112],['C','membrane',676,62],['D','nucleus',420,98]].forEach(function(p){
      s+='<g class="pin" data-part="'+p[1]+'" tabindex="0" role="button" aria-label="Part '+p[0]+'"><circle cx="'+p[2]+'" cy="'+p[3]+'" r="13"/><text x="'+p[2]+'" y="'+(p[3]+4.5)+'" text-anchor="middle">'+p[0]+'</text></g>';
    });
    /* part labels, shown once found (level 2 only) */
    if(lv===1){
      s+='<text class="lab" data-lab="nucleus" x="420" y="246" text-anchor="middle">Nucleus</text>';
      s+='<text class="lab" data-lab="mito" x="600" y="216" text-anchor="middle">Mitochondrion</text>';
      s+='<text class="lab" data-lab="membrane" x="560" y="20" text-anchor="middle">Cell membrane</text>';
      s+='<text class="lab" data-lab="cytoplasm" x="540" y="292" text-anchor="middle">Cytoplasm</text>';
    }
    if(lv===2){
      /* food outside the cell */
      s+='<text x="110" y="52" text-anchor="middle" id="t-starch">Starch</text><text x="110" y="208" text-anchor="middle" id="t-protein">Protein</text>';
      s+='<path id="l-starch" class="mv" d="M38,90 L182,90" stroke="var(--ink)" stroke-width="3"/>';
      s+='<path id="l-protein" class="mv" d="M38,246 L182,246" stroke="var(--ink)" stroke-width="3"/>';
      for(var i=0;i<5;i++)s+='<polygon id="g'+i+'" class="mv" points="'+HEX+'" fill="var(--glucose)"/>';
      s+='<path id="l-new" class="mv" d="M340,268 L404,268" stroke="var(--ink)" stroke-width="3"/>';
      for(i=0;i<5;i++)s+='<circle id="a'+i+'" class="mv" r="13" fill="var(--carrier)"/>';
      s+='<path id="enz1" class="mv" d="M0,0 L14.5,-10 A18,18 0 1 0 14.5,10 Z" fill="var(--fat)"/><path id="enz2" class="mv" d="M0,0 L14.5,-10 A18,18 0 1 0 14.5,10 Z" fill="var(--fat)"/>';
      for(i=0;i<3;i++)s+='<circle id="o'+i+'" class="mv" r="6" fill="var(--o2)"/>';
      for(i=0;i<3;i++)s+='<circle id="c'+i+'" class="mv" r="6" fill="var(--co2)"/>';
      for(i=0;i<4;i++)s+='<polygon id="s'+i+'" class="mv" points="0,-13 3.8,-4 13,-4 5.6,2 8.3,12 0,6.3 -8.3,12 -5.6,2 -13,-4 -3.8,-4" fill="var(--atp)" stroke="var(--atp-ink)" stroke-width="1"/>';
      s+='<text class="lab sub" id="t-enz" x="110" y="128" text-anchor="middle">Enzyme</text>';
      s+='<text class="lab" id="t-glu" x="110" y="150" text-anchor="middle">Glucose</text>';
      s+='<text class="lab" id="t-ami" x="110" y="300" text-anchor="middle">Amino acids</text>';
      s+='<text class="lab sub" id="t-o2" x="712" y="18" text-anchor="end">Oxygen in</text>';
      s+='<text class="lab" id="t-atp" x="600" y="238" text-anchor="middle">ATP</text>';
      s+='<text class="lab sub" id="t-co2" x="632" y="334" text-anchor="end">Carbon dioxide out</text>';
      s+='<text class="lab sub" id="t-new" x="372" y="298" text-anchor="middle">New protein</text>';
      s+='<text class="lab sub" id="t-carb" x="12" y="24">Starch and glucose are carbohydrates</text>';
    }
    return s+'</svg>';
  }
  /* Level 3: where everything is after n finished steps */
  function applyScene(root,n){
    function mv(id,x,y,op,sc){var e=root.querySelector('#'+id);if(!e)return;e.style.transform='translate('+x+'px,'+y+'px)'+(sc===undefined?'':' scale('+sc+')');e.style.opacity=op===undefined?1:op;}
    function lab(id,on){var e=root.querySelector('#'+id);if(e)e.classList.toggle('on',!!on);}
    var cut=n>=1,i;
    var gIn=[[352,72],[520,74],[556,256]];
    for(i=0;i<5;i++){
      var gx=38+i*36+(cut?(i-2)*7:0),gy=90;
      if(n>=4&&i<3){gx=gIn[i][0];gy=gIn[i][1];}
      var gop=1;
      if(n>=5&&i===1){gx=600;gy=162;}
      if(n>=7&&i===1)gop=0;
      mv('g'+i,gx,gy,gop);
    }
    root.querySelector('#l-starch').style.opacity=cut?0:1;
    mv('enz1',92,118,cut?1:0);lab('t-enz',cut&&n<4);lab('t-glu',n>=2&&n<4);
    var pcut=n>=3;
    for(i=0;i<5;i++){
      var ax=38+i*36+(pcut?(i-2)*7:0),ay=246;
      if(n>=9&&i<3){ax=340+i*32;ay=268;}
      mv('a'+i,ax,ay,1);
    }
    root.querySelector('#l-protein').style.opacity=pcut?0:1;
    root.querySelector('#l-new').style.opacity=n>=9?1:0;
    mv('enz2',92,274,pcut&&n<9?1:0);lab('t-ami',pcut&&n<9);lab('t-new',n>=9);
    var oIn=[[572,150],[622,176],[600,142]],oOut=[[716,24],[700,8],[684,20]];
    for(i=0;i<3;i++){var o=n>=6?oIn[i]:oOut[i];mv('o'+i,o[0],o[1],n>=6&&n<8?1:(n>=8?0:0));}
    lab('t-o2',n===6);
    var sp=[[556,108],[648,112],[668,214],[546,216]];
    for(i=0;i<4;i++)mv('s'+i,sp[i][0],sp[i][1],n>=7?1:0,n>=7?1:.2);
    lab('t-atp',n>=7);
    var cOut=[[712,300],[688,326],[652,332]];
    for(i=0;i<3;i++){var c=n>=8?cOut[i]:[600,162];mv('c'+i,c[0],c[1],n>=8?1:0);}
    lab('t-co2',n>=8);lab('t-carb',n>=10);
  }
  function makeScene(lv,qi){
    var box=h('div',{'class':'scene'+(lv===2?' wide':''),html:sceneSVG(lv)});
    if(lv===1){
      for(var k=levelStart(1);k<qi;k++)if(Q[k].type==='click'){var l=box.querySelector('[data-lab="'+Q[k].part+'"]');if(l)l.classList.add('on');}
    }else{
      /* place without animating first */
      [].forEach.call(box.querySelectorAll('.mv'),function(e){e.style.transition='none';});
      applyScene(box,qi-levelStart(2));
      setTimeout(function(){[].forEach.call(box.querySelectorAll('.mv'),function(e){e.style.transition='';});},50);
    }
    return box;
  }

  /* ---------- screens ---------- */
  function intro(){
    viewing=null;startBest=readBest()||0;
    show([
      head('Your mission','Explore the cell and learn 15 science words.',HERO),
      h('p',{text:'There are three levels. First you match molecule words to their meanings, then you label the parts of a cell, then you feed the cell to make energy.'}),
      h('p',{text:'There are '+MAX+' questions. Each one is worth 1 point, and you earn it by getting the answer right on your first try. If you miss one, you can retake it, and you can go back to earlier questions.'}),
      h('button',{'class':'go',type:'button',text:'Start',on:{click:function(){
        st.i=0;st.score=0;st.got=[];st.order=shuffle(TERMS.map(function(t,i){return i;}));st.cards=shuffle(TERMS.map(function(t,i){return i;}));
        introSeen={};peeked=false;saveProgress(0);play();
      }}})
    ]);
  }
  function levelIntro(lv){
    viewing=levelStart(lv);
    show([
      head('Level '+(lv+1)+' of '+LEVELS.length,esc(LEVELS[lv].name)),
      h('p',{text:LEVELS[lv].intro}),
      h('button',{'class':'go',type:'button',text:'Start level '+(lv+1),on:{click:function(){introSeen[lv]=true;play();}}})
    ]);
    card.querySelector('button.go').focus();
  }

  /* play() asks the next question. play(idx,onDone,true) is a retake of question idx:
     a clean first-try answer on a retake earns the point that was missed. */
  function play(idx,onDone,retake,ready){
    if(idx===undefined)idx=st.i;
    var c=Q[idx],lv=c.lv,misses=0,fb=h('div',{'class':'fb','aria-live':'polite'});
    if(!retake&&!onDone&&idx>=st.i&&idx===levelStart(lv)&&!introSeen[lv]){levelIntro(lv);return;}
    var nInLevel=idx-levelStart(lv)+1,total=Q.filter(function(q){return q.lv===lv;}).length;
    var where=(retake?'Retake \u00b7 ':'')+'Level '+(lv+1)+' \u00b7 '+LEVELS[lv].name+' \u00b7 Question '+nInLevel+' of '+total;
    var passed=!onDone&&idx<st.i; /* an earlier question, reached with Back */
    viewing=idx;
    var navBox=h('div',{'class':'btns'});
    function forward(){
      if(onDone){onDone();return;}
      if(idx+1>st.i)st.i=idx+1;
      idx+1<MAX?play(idx+1):end();
    }
    /* Back, Retake and Next. Next shows once the question is answered, or if it was passed before. */
    function nav(answered,pts){
      var bs=[],last=idx===MAX-1;
      if(!onDone&&idx>0)bs.push(h('button',{'class':'go alt',type:'button',text:'Back',on:{click:function(){play(idx-1);}}}));
      if(answered&&!pts&&!st.got[idx])bs.push(h('button',{'class':'go',type:'button',text:'Retake this question',on:{click:function(){play(idx,onDone,true);}}}));
      if(answered||passed)bs.push(h('button',{'class':'go'+(answered&&(pts||st.got[idx])?'':' alt'),type:'button',text:onDone?'Continue':(last?'See your results':'Next'),on:{click:forward}}));
      navBox.innerHTML='';bs.forEach(function(x){navBox.appendChild(x);});
      var main=navBox.querySelector('button.go:not(.alt)');
      if(answered&&(main||bs.length))(main||bs[bs.length-1]).focus();
    }
    nav(false);
    if(passed&&!retake){fb.className='fb';fb.textContent=st.got[idx]?'You already earned this point. You can answer again for practice.':'You missed this one earlier. Get it right on the first try to earn the point.';}
    function miss(el,msg){misses++;if(el)shake(el);fb.className='fb no';fb.innerHTML='<strong>Not quite.</strong>';fb.appendChild(document.createTextNode(msg||c.hint||''));}
    function win(why,after){
      var pts=misses?0:1,had=!!st.got[idx],U='point';
      fb.className='fb ok';
      fb.innerHTML='<strong>'+starHTML(pts||had)+(pts?(had?'Correct. You already had this '+U+'.':'Correct. +1 '+U+(retake||passed?' earned this time.':'')):(had?'Got it. It took more than one try, but you keep the '+U+' you earned before.':'Got it. No '+U+' yet, because it took more than one try. Retake the question to earn it.'))+'</strong>';
      fb.appendChild(document.createTextNode(why));
      if(after)after();
      if(pts&&!had){st.got[idx]=1;st.score++;}
      if(!onDone&&idx+1>st.i)st.i=idx+1; /* this question is now behind her, so Back and Next treat it as passed */
      saveBest(st.score);saveProgress(onDone?st.i:Math.max(st.i,idx+1));
      status();nav(true,pts);
    }

    /* ----- Level 1: find the card ----- */
    if(c.type==='find'){
      /* on a retake every card starts face down again, after a fresh look */
      var fresh=retake||passed,slot=idx-levelStart(0),term=TERMS[st.order[slot]],found={},k,studied=fresh?!!ready:peeked;
      if(!fresh)for(k=0;k<slot;k++)found[st.order[k]]=true;
      var busy=false,btns=[];
      function face(b,ti,up){
        b.className='flip'+(up?'':' down');
        b.innerHTML=up?'<svg viewBox="0 0 120 60" aria-hidden="true">'+TERMS[ti].art+'</svg><span>'+esc(TERMS[ti].m)+'</span>':'?';
        b.setAttribute('aria-label',up?TERMS[ti].m:'Face-down card '+(btns.indexOf(b)+1));
      }
      var deck=h('div',{'class':'deck'});
      st.cards.forEach(function(ti,pos){
        var b=h('button',{type:'button','data-pos':pos});btns.push(b);deck.appendChild(b);
        b.addEventListener('click',function(){
          if(busy||b.disabled||!studied)return;
          if(ti===st.order[slot]){face(b,ti,true);b.classList.add('right');btns.forEach(function(x){x.disabled=true;});win(term.why);}
          else{
            busy=true;face(b,ti,true);b.classList.add('miss');
            miss(b,'That card does not mean '+term.t.toLowerCase()+'. Remember what it says, then try another.');
            setTimeout(function(){face(b,ti,false);busy=false;},1800);
          }
        });
      });
      function draw(allUp){btns.forEach(function(b,pos){var ti=st.cards[pos];var up=allUp||found[ti];face(b,ti,up);if(found[ti]){b.classList.add('right');b.disabled=true;}else b.disabled=allUp;});}
      if(!studied){
        draw(true);
        show([head(where,'Study the cards.'),
          h('p',{text:'Read what each card says and remember where it is. When you are ready, the cards turn face down.'}),
          deck,
          h('button',{'class':'go',type:'button',text:'I\u2019m ready. Turn them over',on:{click:function(){if(fresh)play(idx,onDone,retake,true);else{peeked=true;play();}}}}),navBox]);
        return;
      }
      draw(false);
      show([head(where,'Find the card that means <em>'+esc(term.t)+'</em>.'),deck,fb,navBox]);
      return;
    }

    /* ----- Levels 2 and 3: the cell diagram ----- */
    var scene=makeScene(lv,idx),step=idx-levelStart(2)+1;
    function after(){
      if(lv===1&&c.type==='click'){var l=scene.querySelector('[data-lab="'+c.part+'"]');if(l)l.classList.add('on');}
      if(lv===2)applyScene(scene,step);
    }
    if(c.type==='click'){
      scene.classList.add('pick');
      var done=false;
      var choose=function(e){
        if(done)return;
        var t=e.target.closest('[data-part]');if(!t)return;
        if(e.type==='keydown'){if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();}
        if(t.getAttribute('data-part')===c.part){
          done=true;scene.classList.remove('pick');
          [].forEach.call(scene.querySelectorAll('.part[data-part="'+c.part+'"]'),function(p){if(c.part!=='membrane')p.classList.add('hit');});
          win(c.why,after);
        }else miss(scene,c.hint);
      };
      scene.addEventListener('click',choose);scene.addEventListener('keydown',choose);
      show([head(where,esc(c.q)),h('p',{text:'Click the part itself or its letter.'}),scene,fb,navBox]);
      return;
    }
    var order=shuffle(c.opts.map(function(t,i){return i;}));
    var obtn=order.map(function(i){
      return h('button',{type:'button',text:c.opts[i],on:{click:function(){
        if(i===0){this.classList.add('right');obtn.forEach(function(b){b.disabled=true;});win(c.why,after);}
        else{this.classList.add('wrong');this.disabled=true;miss(this);}
      }}});
    });
    show([head(where,esc(c.q)),scene,h('div',{'class':'opts'},obtn),fb,navBox]);
  }

  function end(){
    viewing=null;
    var tier=st.score>=MAX-2?0:(st.score>=MAX*0.65?1:2),rank=CFG.ranks[tier];
    card.style.setProperty('--medal',['var(--atp)','var(--gas)','var(--food)'][tier]);
    var missed=[];for(var k=0;k<MAX;k++)if(!st.got[k])missed.push(k);
    var saved=saveBest(st.score);
    var savedMsg=!saved?'Your points could not be saved in this browser window.'
      :(st.score>startBest?'New best score. '+st.score+' points now count toward your total on the home page.'
      :'Your best score on this page is still '+readBest()+'. Beat it to raise your total.');
    show([
      head('Mission complete','You explored the whole cell.',MEDAL),
      h('p',{'class':'big',text:st.score+' / '+MAX+' points'}),
      h('p',{text:'Rank: '+rank+'.'}),
      h('p',{text:savedMsg}),
      h('p',{text:'The whole story in one line: enzymes cut starch into glucose and protein into amino acids; glucose crosses the cell membrane, and the mitochondrion uses oxygen to turn its energy into ATP, giving off carbon dioxide; the cell uses amino acids to build new proteins.'}),
      h('div',{'class':'btns'},missed.length?[
        h('button',{'class':'go',type:'button',text:'Retake the '+(missed.length===1?'question':missed.length+' questions')+' you missed',on:{click:function(){review(missed,0);}}}),
        h('button',{'class':'go alt',type:'button',text:'Back',on:{click:function(){play(MAX-1);}}}),
        h('button',{'class':'go alt',type:'button',text:'Start again from 0',on:{click:restart}})
      ]:[h('button',{'class':'go',type:'button',text:'Play again',on:{click:restart}}),
         h('button',{'class':'go alt',type:'button',text:'Back',on:{click:function(){play(MAX-1);}}})])
    ]);
  }
  /* retake the missed questions one after another, then come back to the results */
  function review(list,k){
    if(k>=list.length){end();return;}
    play(list[k],function(){review(list,k+1);},true);
  }

  document.getElementById('restart').addEventListener('click',restart);
  var saved=loadProgress();
  if(saved){
    st.i=saved.i;st.score=saved.score;st.got=saved.got;st.order=saved.order;st.cards=saved.cards;startBest=saved.startBest||0;
    if(st.i<MAX){introSeen[Q[st.i].lv]=st.i!==levelStart(Q[st.i].lv);play();}else end();
  }else intro();
})();
</script>
</body>
