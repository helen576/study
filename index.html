<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good good study, day day up!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Console layout: topics in a dark sidebar with the points total; search, filters and picture cards in the main area. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  color-scheme: light;
  --side: #172437; --side-ink: #dce3ee; --side-muted: #93a1b7; --side-line: #2a3a52;
  --page: #f1f3f6; --surface: #ffffff; --ink: #1a2333; --muted: #586377; --rule: #dce1e8;
  --accent: #0e7c86; --ok: #1f7a4c; --ok-tint: #e3f2ea; --go: #9a5b00; --go-tint: #fbf0dc;
  --font: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  /* colours used by the card drawings */
  --panel: #ffffff; --line: #c9d6d6; --cell: #e3f0ee; --cell-edge: #8fb8b3; --mito: #f8dccf; --mito-ink: #b5553a; --blood: #f3d3d3;
  --glucose: #3f62d6; --fat: #c2488a; --amino: #5f9420; --carrier: #12909a; --proton: #8556d8; --gas: #7c8f96;
  --atp: #e39a0c; --atp-ink: #8a5a00; --rich: #d23b3b; --poor: #3f5fc9; --o2: #e0552f; --co2: #5d7f9c;
  --food: #a9743a; --waste: #6b4a2a; --water: #2f9fd0; --gland: #f3e2a8; --bread: #e3b877; --egg: #fffdf5;
}
body { font-family: var(--font); background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

/* ---------- sidebar ---------- */
aside { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 1.6rem 1.1rem 2rem; }
.from { font-size: .8rem; color: var(--side-muted); }
aside h1 { font-size: 1.3rem; line-height: 1.2; font-weight: 600; margin: .35rem 0 1.4rem; color: #fff; text-wrap: balance; }
.total { background: rgba(255,255,255,.05); border: 1px solid var(--side-line); border-radius: 10px; padding: .85rem .9rem; margin-bottom: 1.5rem; }
.total .num { font-size: 1.9rem; font-weight: 600; color: #ffc24a; line-height: 1.1; }
.total .num span { font-size: .95rem; font-weight: 400; color: var(--side-muted); }
.total p { font-size: .82rem; color: var(--side-muted); margin: .15rem 0 .6rem; }
.meter { height: 6px; border-radius: 3px; background: var(--side-line); overflow: hidden; }
.meter i { display: block; height: 100%; background: #ffc24a; }
.sections { list-style: none; display: grid; gap: 2px; }
.sections a { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: .65rem; text-decoration: none; color: var(--side-ink);
  padding: .5rem .6rem; border-radius: 8px; font-size: .9rem; }
.sections a:hover { background: rgba(255,255,255,.06); }
.sections a:focus-visible { outline: 2px solid #8fd3d8; outline-offset: 1px; }
.sections .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--g); box-shadow: 0 0 0 1.5px var(--g-300); }
.sections .cnt { font-size: .8rem; color: var(--side-muted); }

/* ---------- main ---------- */
main { padding: 1.6rem 2rem 4rem; min-width: 0; }
.intro { color: var(--muted); max-width: 70ch; font-size: .95rem; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: 1.1rem 0 1.5rem; position: sticky; top: 0; z-index: 4;
  background: var(--page); padding: .75rem 0; border-bottom: 1px solid var(--rule); }
.search { position: relative; flex: 1 1 260px; max-width: 380px; }
.search svg { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; font: inherit; padding: .55rem .8rem .55rem 2.2rem; border: 1px solid #c4ccd8; border-radius: 8px; background: var(--surface); color: var(--ink); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.filters { display: inline-flex; background: var(--surface); border: 1px solid #c4ccd8; border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: .88rem; border: 0; background: none; color: var(--muted); padding: .35rem .7rem; border-radius: 6px; cursor: pointer; }
.filters button span { margin-left: .3rem; color: #8a94a6; }
.filters button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.filters button[aria-pressed="true"] span { color: #c8d0dc; }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

section.group { margin-bottom: 2.2rem; scroll-margin-top: 84px; }
.ghead { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .8rem; padding-left: .7rem; border-left: 4px solid var(--g); }
.ghead h2 { font-size: 1.05rem; font-weight: 600; }
.ghead p { font-size: .85rem; color: var(--muted); margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.mod { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; }
.mod:hover { border-color: var(--g); }
.mod:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pic { aspect-ratio: 16 / 9; background: var(--g-50); padding: 10px 14px; }
.pic svg { display: block; width: 100%; height: 100%; }
.pic .organ { fill: var(--mito); stroke: var(--mito-ink); stroke-width: 2.5; }
.mod .b { padding: .7rem .8rem .8rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
.mod h3 { font-size: .98rem; font-weight: 600; line-height: 1.3; }
.mod .about { font-size: .84rem; color: var(--muted); }
.meta { margin-top: auto; padding-top: .3rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .8rem; color: var(--muted); }
.kind { font-weight: 600; color: var(--g-700); }
.chip { font-size: .76rem; font-weight: 500; padding: .12rem .5rem; border-radius: 999px; background: #eceff3; color: var(--muted); white-space: nowrap; }
.chip.go { background: var(--go-tint); color: var(--go); }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.thin { height: 3px; background: #e6e9ee; }
.thin i { display: block; height: 100%; background: var(--g); }
.mod.done .thin i { background: var(--ok); }

.empty { background: var(--surface); border: 1px dashed #b9c2cf; border-radius: 10px; padding: 1.5rem; color: var(--muted); }
.empty button { font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; cursor: pointer; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; padding: 1.25rem 16px 1rem; }
  aside h1 { margin-bottom: 1rem; }
  .total { margin-bottom: 1rem; }
  .sections { display: flex; overflow-x: auto; gap: 6px; padding-bottom: .25rem; }
  .sections a { grid-template-columns: 10px auto auto; white-space: nowrap; background: rgba(255,255,255,.05); }
  main { padding: 1rem 16px 3rem; }
  .toolbar { position: static; }
  .filters { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; }
  .filters button { white-space: nowrap; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mod h3 { font-size: .9rem; }
  .mod .about { display: none; }
  .meta { flex-direction: column; align-items: flex-start; gap: .3rem; }
  .search { max-width: none; }
}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Good good study, day day up!</h1>
  <div class="total" aria-live="polite">
    <div class="num" id="tot-num">0 <span>of 0</span></div>
    <p id="tot-note">points earned</p>
    <div class="meter" aria-hidden="true"><i id="tot-bar" style="width:0"></i></div>
  </div>
  <nav aria-label="Jump to topic"><ul class="sections" id="sections"></ul></nav>
</aside>

    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search pages" aria-label="Search pages" autocomplete="off"></label>
    <div class="filters" role="group" aria-label="Show pages" id="filters"></div>
  </div>
  <div id="groups"></div>
</main>
</div>

const FILTERS = [["all", "All"], ["anim", "Animations"], ["game", "Games"], ["todo", "Points still to earn"]];
let filter = "all";

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function vars(g) {
  return `--g:${g};--g-50:${mix(g, "#ffffff", 0.9)};--g-300:${mix(g, "#ffffff", 0.5)};--g-700:${mix(g, "#000000", 0.22)}`;
}
function storageWorks() { try { localStorage.getItem("study-points:test"); return true; } catch (e) { return false; } }
/* best score saved by a game page */
function best(p) {
  if (!p.id) return 0;
  try {
    const key = "study-points:" + p.id, r = JSON.parse(localStorage.getItem(key) || "null");
    if (!r || typeof r.best !== "number") return 0;
    /* s:1 marks the current scoring. Such a score carries over when a page's maximum changes, capped at the new maximum. */
    if (r.s === 1) return Math.max(0, Math.min(p.max, r.best));
    /* a save from before the marker existed, on the same scale: mark it so it carries over from now on */
    if (r.max === p.max) { localStorage.setItem(key, JSON.stringify({ best: r.best, max: r.max, s: 1 })); return Math.max(0, Math.min(p.max, r.best)); }
    return 0;
  } catch (e) { return 0; }
}
function chip(p, b) {
  if (b >= p.max) return `<span class="chip ok">${b} / ${p.max} · Full points</span>`;
  if (b) return `<span class="chip go">${b} / ${p.max} points</span>`;
  return `<span class="chip">${p.kind === "Game" ? "Not played" : "Not watched"} · ${p.max} points</span>`;
}

function render() {
  const query = document.getElementById("q").value.trim().toLowerCase();
  const counts = { all: 0, anim: 0, game: 0, todo: 0 };
  let html = "", side = "", shownTotal = 0, total = 0, possible = 0;
  GROUPS.forEach((g, gi) => {
    const id = "topic-" + (gi + 1), v = vars(g.color);
    let cards = "", shown = 0, gp = 0, gmax = 0;
    for (const p of g.pages) {
      const b = best(p), isGame = p.kind === "Game";
      gp += b; gmax += p.max;
      const kinds = { all: true, anim: !isGame, game: isGame, todo: b < p.max };
      const match = !query || p.title.toLowerCase().includes(query) || g.name.toLowerCase().includes(query) || p.kind.toLowerCase().includes(query);
      if (match) for (const k in counts) if (kinds[k]) counts[k]++;
      if (!match || !kinds[filter]) continue;
      shown++;
      const pct = Math.round(b / p.max * 100);
      const label = `${p.title}, ${p.kind.toLowerCase()}, ${b} of ${p.max} points`;
      cards += `<a class="mod${b >= p.max ? " done" : ""}" href="${esc(p.file)}" aria-label="${esc(label)}">
        <div class="pic"><svg viewBox="0 0 200 130" aria-hidden="true" focusable="false">${ART[p.art] || ""}</svg></div><div class="thin" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <div class="b"><h3>${esc(p.title)}</h3><p class="about">${esc(p.about)}</p><div class="meta"><span class="kind">${esc(p.kind)}</span>${chip(p, b)}</div></div></a>`;
    }
    total += gp; possible += gmax; shownTotal += shown;
    side += `<li><a href="#${id}" style="${v}"><span class="dot" aria-hidden="true"></span><span>${esc(g.name)}</span><span class="cnt">${gp}/${gmax}</span></a></li>`;
    if (shown) html += `<section class="group" id="${id}" style="${v}"><div class="ghead"><h2>${esc(g.name)}</h2><p>${gp} of ${gmax} points</p></div><div class="grid">${cards}</div></section>`;
  });
  if (!shownTotal) {
    html = `<div class="empty">No pages${query ? ` match “${esc(query)}”` : " here yet"}. <button type="button" id="clear">Show all pages</button></div>`;
  }
  document.getElementById("groups").innerHTML = html;
  document.getElementById("sections").innerHTML = side;
  document.getElementById("filters").innerHTML = FILTERS.map(([k, label]) =>
    `<button type="button" data-f="${k}" aria-pressed="${k === filter}">${label}<span>${counts[k]}</span></button>`).join("");
  document.getElementById("tot-num").innerHTML = `${total} <span>of ${possible}</span>`;
  document.getElementById("tot-note").textContent = storageWorks() ? "points earned" : "This browser window is not saving points. Try Chrome, Edge or Safari, outside private mode.";
  document.getElementById("tot-bar").style.width = (possible ? total / possible * 100 : 0) + "%";
  const clear = document.getElementById("clear");
  if (clear) clear.onclick = () => { filter = "all"; document.getElementById("q").value = ""; render(); };
}
document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f; render();
  const again = document.querySelector(`#filters button[data-f="${filter}"]`); if (again) again.focus();
});
document.getElementById("q").addEventListener("input", render);
/* Update whenever she comes back to this page, including from another tab. */
["pageshow", "focus", "storage"].forEach(ev => window.addEventListener(ev, render));
document.addEventListener("visibilitychange", render);
render();
</script>
